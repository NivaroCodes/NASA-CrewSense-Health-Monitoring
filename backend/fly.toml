# fly.toml app configuration file generated for nasa-crewsense-health-monitoring on 2026-11-15T03:39:00Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'nasa-crewsense-health-monitoring'
primary_region = 'ams'

[build]
[deploy]
  release_command = 'python -m alembic upgrade head'

[env]
  PORT = '8080'

[processes]
  app = 'python -m uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/api/v1/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
