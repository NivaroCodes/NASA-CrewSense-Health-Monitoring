# Fly.io configuration for the CrewSense FastAPI backend.
#
# Deploy from the backend folder (Fly reads this file from the current directory):
# The app `nasa-crewsense-health-monitoring` already exists in region `ams` (Amsterdam).
#   fly secrets set DATABASE_URL="<postgres url>" CREWSENSE_CORS_ORIGINS="https://<vercel-domain>"
#   fly deploy
#
# Secrets (never put these in this file):
#   DATABASE_URL            PostgreSQL URL. `fly postgres attach` sets it for you. Required: without
#                           it the release command and the app both stop with an error.
#   CREWSENSE_CORS_ORIGINS  Comma-separated list of allowed frontend origins. When unset, no
#                           browser origin may call the API.
#   CREWSENSE_SEED_DEMO     "true" seeds the synthetic demo astronaut. Production default: "false".
#
# The release command runs once per deploy, before the new machines start.
# It applies Alembic migrations, so the app never creates tables on PostgreSQL.

app = "nasa-crewsense-health-monitoring"
primary_region = "ams"

[build]
  # Relative to this file. Dependencies are installed into the image's `python`.
  dockerfile = "Dockerfile"

[deploy]
  release_command = "python -m alembic upgrade head"

[env]
  # Must match internal_port below.
  PORT = "8080"
  # Production mode: PostgreSQL is required and SQLite is refused (see app/core/config.py).
  CREWSENSE_ENV = "production"

[processes]
  app = "python -m uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8080"

[http_service]
  internal_port = 8080
  processes = ["app"]
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  # Liveness and database reachability, from GET /api/v1/health.
  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/v1/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
